<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>모바일 청첩장</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  html,body{margin:0;background:#EAE3D6;font-family:'Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif}
  .state{max-width:440px;margin:0 auto;min-height:100vh;display:grid;place-items:center;text-align:center;color:#6E675B;padding:30px}
  .state b{display:block;font-size:16px;color:#332F29;margin-bottom:8px}
</style>
</head>
<body>
<div class="state" id="state"><div><b>청첩장을 불러오는 중…</b>잠시만 기다려주세요</div></div>
<script>
  const SUPA_URL="https://emqkhunzbbcanprikbaz.supabase.co";
  const SUPA_KEY="sb_publishable_XjgXsvUPr6A1pIc6HdWmGQ_UOUtbo4o";
  const slug=new URLSearchParams(location.search).get("s");
  const state=document.getElementById("state");
  function fail(msg){ state.innerHTML='<div><b>'+msg+'</b>링크를 다시 확인해주세요.</div>'; }
  if(!slug){ fail("잘못된 링크입니다"); }
  else{
    fetch(SUPA_URL+"/rest/v1/invitations?slug=eq."+encodeURIComponent(slug)+"&select=html&limit=1",
      {headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY}})
      .then(r=>r.json())
      .then(rows=>{
        if(!rows||!rows.length){ fail("청첩장을 찾을 수 없습니다"); return; }
        document.open(); document.write(rows[0].html); document.close();
      })
      .catch(()=>fail("청첩장을 불러오지 못했습니다"));
  }
</script>
</body>
</html>
