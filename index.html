<title>모청 메이커</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* ---------- Design tokens (single committed warm-light identity) ---------- */
  :root{
    --ivory:#FAF6EE;        /* invitation ground */
    --paper:#FFFFFF;
    --ink:#332F29;          /* primary text */
    --soft:#6E675B;         /* muted text */
    --faint:#9A9184;        /* labels */
    --line:#E9E0D2;         /* hairlines */
    --sage:#7E8B6D;         /* the accent */
    --sage-deep:#5E6A4C;
    --rose:#C0857E;         /* single warm pop (heart / d-day) */

    --app-bg:#EAE3D6;       /* editor frame */
    --app-panel:#FFFFFF;
    --app-line:#DDD3C2;
    --app-ink:#33302B;
    --app-soft:#7A7264;

    --serif:Georgia,'Times New Roman',serif;
    --kserif:'Nanum Myeongjo','Apple SD Gothic Neo',Georgia,serif;
    --sans:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans);
    background:var(--app-bg);
    color:var(--app-ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  button{font-family:inherit;cursor:pointer}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

  /* ---------- App shell ---------- */
  .app{display:grid;grid-template-columns:minmax(340px,1fr) minmax(360px,440px);gap:0;min-height:100vh}
  .topbar{
    grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 22px;background:var(--app-panel);border-bottom:1px solid var(--app-line);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
  .brand b{font-family:var(--kserif);font-size:20px;letter-spacing:.02em;font-weight:600;color:var(--ink)}
  .brand span{font-size:12px;color:var(--app-soft);letter-spacing:.14em;text-transform:uppercase}
  .btn{
    border:1px solid var(--app-line);background:var(--app-panel);color:var(--app-ink);
    padding:9px 15px;border-radius:9px;font-size:13.5px;font-weight:600;transition:.15s;
  }
  .btn:hover{border-color:var(--sage);color:var(--sage-deep)}
  .btn.primary{background:var(--sage);border-color:var(--sage);color:#fff}
  .btn.primary:hover{background:var(--sage-deep);border-color:var(--sage-deep);color:#fff}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--app-soft)}
  .btn.ghost:hover{color:var(--rose)}

  /* ---------- Editor ---------- */
  .editor{padding:26px 30px 80px;overflow:auto;max-height:calc(100vh - 57px)}
  .editor h2{
    font-family:var(--kserif);font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--sage-deep);
    margin:34px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--app-line);
    display:flex;align-items:center;gap:9px;
  }
  .editor h2:first-child{margin-top:4px}
  .editor h2 .n{font-family:var(--serif);font-size:12px;color:var(--faint);font-weight:400}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--app-soft);margin-bottom:6px;letter-spacing:.01em}
  .field input,.field textarea{
    width:100%;padding:10px 12px;border:1px solid var(--app-line);border-radius:8px;
    font-family:inherit;font-size:14px;color:var(--app-ink);background:#FCFAF6;transition:.15s;
  }
  .field input:focus,.field textarea:focus{outline:none;border-color:var(--sage);background:#fff;box-shadow:0 0 0 3px rgba(126,139,109,.12)}
  .field textarea{resize:vertical;min-height:88px;line-height:1.7}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{font-size:11.5px;color:var(--faint);margin-top:5px}
  .imgrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .filebtn{
    display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px dashed var(--app-line);
    border-radius:8px;font-size:13px;color:var(--app-soft);background:#FCFAF6;
  }
  .filebtn:hover{border-color:var(--sage);color:var(--sage-deep)}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .thumb{position:relative;width:62px;height:62px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb button{position:absolute;top:2px;right:2px;width:18px;height:18px;border:none;border-radius:50%;
    background:rgba(51,47,41,.72);color:#fff;font-size:12px;line-height:1;display:grid;place-items:center;padding:0}
  .acct-group{border:1px solid var(--app-line);border-radius:9px;padding:12px;margin-bottom:12px;background:#FCFAF6}
  .acct-group>.gl{font-size:12px;font-weight:700;color:var(--sage-deep);margin-bottom:9px;letter-spacing:.02em}
  .acct{display:grid;grid-template-columns:1fr 1.4fr 1fr auto;gap:7px;margin-bottom:7px;align-items:center}
  .acct input{padding:7px 9px;font-size:12.5px}
  .acct .x{border:none;background:transparent;color:var(--faint);font-size:16px;padding:0 4px}
  .acct .x:hover{color:var(--rose)}
  .addacct{font-size:12px;color:var(--sage-deep);background:none;border:1px dashed var(--app-line);padding:6px 10px;border-radius:7px;width:100%}
  .addacct:hover{border-color:var(--sage)}
  /* theme picker */
  .themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .swatch{display:flex;align-items:center;gap:11px;padding:11px 13px;border:1px solid var(--app-line);border-radius:11px;background:#FCFAF6;transition:.15s;text-align:left}
  .swatch:hover{border-color:var(--sage)}
  .swatch.on{border-color:var(--sage);box-shadow:0 0 0 3px rgba(126,139,109,.14);background:#fff}
  .swatch .dot{width:30px;height:30px;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.06);position:relative;overflow:hidden}
  .swatch .dot::after{content:"";position:absolute;right:0;top:0;bottom:0;width:42%;background:var(--h)}
  .swatch .nm{font-size:13.5px;font-weight:600;color:var(--app-ink);line-height:1.3}
  .swatch .nm small{display:block;font-size:11px;font-weight:400;color:var(--app-soft);letter-spacing:.02em}
  .fx-pick{display:flex;gap:8px;flex-wrap:wrap}
  .fx-pick button{border:1px solid var(--app-line);background:#FCFAF6;padding:8px 14px;border-radius:8px;font-size:13px;color:var(--app-ink)}
  .fx-pick button.on{border-color:var(--sage);background:#fff;color:var(--sage-deep);box-shadow:0 0 0 3px rgba(126,139,109,.12)}
  .toggles{display:flex;flex-direction:column;gap:11px}
  .tg{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--app-ink);font-weight:500;cursor:pointer}
  .tg input{width:16px;height:16px;accent-color:var(--sage)}
  .tg small{color:var(--app-soft);font-weight:400}

  /* ---------- Preview panel ---------- */
  .preview{
    background:var(--app-bg);border-left:1px solid var(--app-line);
    padding:26px 20px;position:sticky;top:57px;height:calc(100vh - 57px);
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .plabel{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--app-soft)}
  .device{
    width:100%;max-width:392px;flex:1;min-height:0;background:var(--ivory);
    border:9px solid #2b2823;border-radius:40px;overflow:hidden;overflow-y:auto;
    box-shadow:0 24px 60px -24px rgba(43,40,35,.55),0 0 0 1px rgba(0,0,0,.04);
    scrollbar-width:thin;
  }
  .device::-webkit-scrollbar{width:0}

  /* ---------- The invitation (also emitted in downloaded file) ---------- */
</style>
<style id="invite-css"></style>
<script>
/* Invitation stylesheet — shared between live preview and exported file */
const INVITE_CSS = `
.invite{min-height:100%;background:var(--ivory,#FAF6EE);color:var(--ink,#332F29);font-family:var(--sans,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif);line-height:1.75;--serif:Georgia,'Times New Roman',serif;--kserif:'Nanum Myeongjo','Apple SD Gothic Neo',Georgia,serif;
  /* default = Sage */
  --ivory:#FAF6EE;--paper:#FFFFFF;--ink:#332F29;--soft:#6E675B;--faint:#9A9184;--line:#E9E0D2;--sage:#7E8B6D;--sage-deep:#5E6A4C;--rose:#C0857E}
/* ---- Theme: Blush (romantic pastel — dusty rose + soft gold) ---- */
.invite.theme-blush{--ivory:#FCF6F3;--paper:#FFFFFF;--ink:#4A3A3A;--soft:#8A7175;--faint:#BDA7A9;--line:#F1E1DE;--sage:#C98A96;--sage-deep:#A85F70;--rose:#BFA069}
/* ---- Theme: Ink (modern minimal — monochrome charcoal) ---- */
.invite.theme-ink{--ivory:#F7F6F4;--paper:#FFFFFF;--ink:#1C1B1A;--soft:#5B5955;--faint:#9C9A95;--line:#E4E2DD;--sage:#2C2A27;--sage-deep:#000000;--rose:#7C7A75}
.invite.theme-ink .names,.invite.theme-ink .stitle,.invite.theme-ink .venue{letter-spacing:.14em}
.invite.theme-ink .eyebrow{color:var(--soft)}
/* ---- Theme: Hanji (Korean traditional — 쪽빛 indigo + 단청 vermilion) ---- */
.invite.theme-hanji{--ivory:#F4EFE2;--paper:#FBF7EC;--ink:#2B2A2E;--soft:#615E64;--faint:#948F86;--line:#E1D8C4;--sage:#3E4C6B;--sage-deep:#2A3550;--rose:#B34F3B}
/* ---- Theme: Classic (warm ivory + antique gold) ---- */
.invite.theme-classic{--ivory:#F3EBDD;--paper:#FCF7EE;--ink:#3A3128;--soft:#6F6455;--faint:#A2957F;--line:#E5D9C3;--sage:#A9843F;--sage-deep:#836123;--rose:#B48A54}
.invite.theme-classic .eyebrow{letter-spacing:.38em}
/* ---- Theme: Botanic (deep forest green + warm clay) ---- */
.invite.theme-botanic{--ivory:#F6F4EC;--paper:#FFFFFF;--ink:#232B22;--soft:#5A6357;--faint:#939A8C;--line:#DDE1D1;--sage:#3B5A3A;--sage-deep:#274227;--rose:#B5765A}
.invite *{box-sizing:border-box;margin:0}
.invite .sec{padding:52px 30px;text-align:center;position:relative}
.invite .eyebrow{font-family:var(--serif);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--sage);margin-bottom:20px}
.invite .rule{width:36px;height:1px;background:var(--line);margin:24px auto}
.invite .stitle{font-family:var(--kserif);font-size:19px;color:var(--ink);margin-bottom:8px;letter-spacing:.02em}

/* cover */
.invite .cover{padding:0}
.invite .cover-photo{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#e6ddcd}
.invite .cover-photo.empty{display:grid;place-items:center;color:var(--faint);font-size:13px;font-family:var(--serif);letter-spacing:.1em}
.invite .cover-body{padding:40px 30px 48px;text-align:center}
.invite .cover-body .eyebrow{margin-bottom:26px}
.invite .names{font-family:var(--kserif);font-size:30px;letter-spacing:.06em;color:var(--ink);line-height:1.4}
.invite .names .amp{display:block;font-family:var(--serif);font-size:15px;color:var(--rose);margin:9px 0;font-style:italic}
.invite .cover-meta{margin-top:26px;font-size:14px;color:var(--soft);letter-spacing:.02em}
.invite .cover-meta .d{font-family:var(--serif);font-size:15px;color:var(--ink);letter-spacing:.08em}

/* greeting */
.invite .greet-body{font-size:15px;color:var(--soft);white-space:pre-line;max-width:30em;margin:0 auto}
.invite .parents{margin-top:30px;font-size:14px;color:var(--ink);line-height:2}
.invite .parents b{font-weight:600}
.invite .parents .rel{color:var(--faint);font-size:12.5px;margin:0 5px}

/* date / dday */
.invite .bigdate{font-family:var(--serif);font-size:26px;letter-spacing:.06em;color:var(--ink)}
.invite .bigdate .dow{display:block;font-size:13px;letter-spacing:.28em;color:var(--sage);margin-top:8px;text-transform:uppercase}
.invite .dday{margin-top:22px;display:inline-block;padding:9px 20px;border:1px solid var(--line);border-radius:40px;font-size:13px;color:var(--soft)}
.invite .dday b{color:var(--rose);font-family:var(--serif);font-size:15px;font-weight:600}

/* gallery */
.invite .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.invite .grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;display:block;background:#e6ddcd;cursor:pointer}
.invite .grid.one{grid-template-columns:1fr}
.invite .grid.one img{aspect-ratio:4/3}

/* location */
.invite .venue{font-family:var(--kserif);font-size:18px;color:var(--ink);margin-bottom:4px}
.invite .vhall{font-size:14px;color:var(--soft);margin-bottom:16px}
.invite .vaddr{font-size:13.5px;color:var(--soft);margin-bottom:18px}
.invite .maplink{display:inline-block;font-family:var(--serif);font-size:12px;letter-spacing:.08em;color:var(--sage-deep);border:1px solid var(--sage);padding:9px 18px;border-radius:40px;text-decoration:none}
.invite .maplink:hover{background:var(--sage);color:#fff}
.invite .transport{margin-top:22px;text-align:left;font-size:13px;color:var(--soft);white-space:pre-line;max-width:26em;margin-left:auto;margin-right:auto;line-height:2}

/* accounts */
.invite .acc{max-width:320px;margin:14px auto 0;text-align:left}
.invite .acc-side{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden;background:var(--paper,#fff)}
.invite .acc-head{width:100%;text-align:left;background:#fff;border:none;padding:14px 16px;font-family:var(--kserif);font-size:14px;color:var(--ink);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.invite .acc-head .caret{color:var(--sage);transition:transform .2s}
.invite .acc-side.open .caret{transform:rotate(180deg)}
.invite .acc-list{display:none;padding:2px 16px 14px}
.invite .acc-side.open .acc-list{display:block}
.invite .acc-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.invite .acc-item .info{font-size:12.5px;color:var(--soft)}
.invite .acc-item .info b{display:block;color:var(--ink);font-size:13.5px;font-weight:600;margin-bottom:2px}
.invite .copy{font-size:11px;color:var(--sage-deep);border:1px solid var(--line);background:#fff;padding:6px 11px;border-radius:20px;white-space:nowrap;cursor:pointer}
.invite .copy:hover{border-color:var(--sage)}
.invite .copy.done{background:var(--sage);color:#fff;border-color:var(--sage)}

/* footer */
.invite .foot{padding:44px 30px 56px;text-align:center}
.invite .foot .heart{color:var(--rose);font-size:15px}
.invite .foot .fnames{font-family:var(--kserif);font-size:15px;color:var(--ink);letter-spacing:.06em;margin-top:14px}
.invite .empty-note{color:var(--faint);font-style:italic;font-size:13px}

/* falling effect */
.invite .fxwrap{position:sticky;top:0;height:0;z-index:1;pointer-events:none}
.invite .fx{position:absolute;top:0;left:0;width:100%;height:100vh;pointer-events:none}

/* background music button */
.invite .musicwrap{position:sticky;bottom:0;height:0;z-index:9;pointer-events:none}
.invite .musicbtn{position:absolute;right:16px;bottom:18px;width:44px;height:44px;border-radius:50%;border:none;background:var(--sage);color:#fff;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.22);pointer-events:auto;cursor:pointer;display:grid;place-items:center}
.invite .musicbtn.playing{animation:mc-spin 4.5s linear infinite}
@keyframes mc-spin{to{transform:rotate(360deg)}}

/* live countdown */
.invite .countdown{display:flex;justify-content:center;gap:9px;margin-top:24px}
.invite .cd-cell{min-width:54px;padding:11px 6px;border:1px solid var(--line);border-radius:11px;background:var(--paper)}
.invite .cd-cell b{display:block;font-family:var(--serif);font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500}
.invite .cd-cell span{font-size:11px;color:var(--faint);letter-spacing:.12em}

/* guestbook */
.invite .gb{max-width:330px;margin:16px auto 0;text-align:left}
.invite .gb-form{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.invite .gb-form input,.invite .gb-form textarea{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-family:inherit;font-size:13.5px;background:var(--paper);color:var(--ink);width:100%}
.invite .gb-form textarea{min-height:62px;resize:vertical;line-height:1.6}
.invite .gb-form input:focus,.invite .gb-form textarea:focus{outline:none;border-color:var(--sage)}
.invite .gb-form button{border:none;background:var(--sage);color:#fff;padding:11px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer}
.invite .gb-form button:disabled{opacity:.6}
.invite .gb-list{display:flex;flex-direction:column;gap:10px}
.invite .gb-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--paper)}
.invite .gb-item .who{font-size:12.5px;font-weight:700;color:var(--sage-deep);margin-bottom:4px}
.invite .gb-item .msg{font-size:13px;color:var(--soft);white-space:pre-line}
.invite .gb-empty{font-size:12.5px;color:var(--faint);text-align:center;padding:16px}
`;
</script>

<div class="app">
  <div class="topbar">
    <div class="brand"><b>모청 메이커</b><span>Mobile Wedding Invitation</span></div>
    <button class="btn ghost" id="btn-sample">예시 채우기</button>
    <button class="btn ghost" id="btn-reset">초기화</button>
    <button class="btn" id="btn-link">🔗 링크 복사</button>
    <button class="btn" id="btn-download">HTML 저장</button>
    <button class="btn primary" id="btn-cloud">☁ 클라우드 링크</button>
  </div>

  <div class="editor" id="editor">
    <h2><span class="n">00</span> 디자인 테마</h2>
    <div class="themes" id="themes">
      <button class="swatch" data-theme="sage"  style="--h:#7E8B6D;background-image:none">
        <span class="dot" style="background:#FAF6EE"></span><span class="nm">세이지<small>차분한 초록 · 내추럴</small></span></button>
      <button class="swatch" data-theme="blush" style="--h:#C98A96">
        <span class="dot" style="background:#FCF6F3"></span><span class="nm">블러쉬<small>로맨틱 파스텔 · 골드</small></span></button>
      <button class="swatch" data-theme="ink"   style="--h:#2C2A27">
        <span class="dot" style="background:#F7F6F4"></span><span class="nm">모던블랙<small>미니멀 · 모노톤</small></span></button>
      <button class="swatch" data-theme="hanji" style="--h:#3E4C6B">
        <span class="dot" style="background:#F4EFE2"></span><span class="nm">한지<small>전통 · 쪽빛 & 단청</small></span></button>
      <button class="swatch" data-theme="classic" style="--h:#A9843F">
        <span class="dot" style="background:#F3EBDD"></span><span class="nm">클래식<small>웜 아이보리 · 앤틱골드</small></span></button>
      <button class="swatch" data-theme="botanic" style="--h:#3B5A3A">
        <span class="dot" style="background:#F6F4EC"></span><span class="nm">보태니컬<small>딥 포레스트 그린</small></span></button>
    </div>

    <h2><span class="n">01</span> 표지 · 두 사람</h2>
    <div class="row">
      <div class="field"><label>신랑 이름</label><input data-k="groom" placeholder="김민준"></div>
      <div class="field"><label>신부 이름</label><input data-k="bride" placeholder="이서연"></div>
    </div>
    <div class="field">
      <label>표지 사진</label>
      <div class="imgrow">
        <label class="filebtn">＋ 사진 선택<input type="file" accept="image/*" id="cover-file" hidden></label>
        <span class="hint" id="cover-name">세로 사진(3:4)이 가장 잘 어울려요</span>
      </div>
      <div class="thumbs" id="cover-thumb"></div>
    </div>

    <h2><span class="n">02</span> 인사말</h2>
    <div class="field"><label>인사말 문구</label>
      <textarea data-k="greeting" placeholder="서로 다른 길을 걸어온 두 사람이&#10;이제 하나의 길을 함께 걷고자 합니다.&#10;귀한 걸음으로 축복해 주시면 감사하겠습니다."></textarea>
      <div class="hint">줄바꿈 그대로 표시됩니다.</div>
    </div>
    <div class="row">
      <div class="field"><label>신랑측 혼주 (예: 김철수 · 박영희)</label><input data-k="groomParents" placeholder="김철수 · 박영희"></div>

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmtDate(d){ if(!d) return null; const dt=new Date(d+"T00:00"); if(isNaN(dt)) return null; return dt; }

function renderInvite(d, forExport){
  const dt = fmtDate(d.date);

      ${d.brideParents?`<div><b>${esc(d.brideParents)}</b><span class="rel">의 딸</span><b>${esc(d.bride)}</b></div>`:""}
    </div>` : "";

  const gallery = (d.gallery&&d.gallery.length) ? `
    <div class="sec">

    </div>` : "";

  const mapq = encodeURIComponent(((d.venue||"")+" "+(d.address||"")).trim());
  const location = (d.venue||d.address) ? `
    <div class="sec">
      <div class="eyebrow">Location</div>
      ${d.venue?`<div class="venue">${esc(d.venue)}</div>`:""}
      ${d.hall?`<div class="vhall">${esc(d.hall)}</div>`:""}
      ${d.address?`<div class="vaddr">${esc(d.address)}</div>`:""}
      ${mapq?`<a class="maplink" href="https://map.kakao.com/?q=${mapq}" target="_blank" rel="noopener">지도에서 보기</a>`:""}

  const acctSide=(label,list)=> (list&&list.length)?`
    <div class="acc-side">
      <button class="acc-head" data-acc>${esc(label)}<span class="caret">▾</span></button>
      <div class="acc-list">
        ${list.map(a=>`<div class="acc-item"><div class="info"><b>${esc(a.bank)} ${esc(a.name)}</b>${esc(a.number)}</div>
          <button class="copy" data-copy="${esc(a.number)}">복사</button></div>`).join("")}
      </div>
    </div>`:"";
  const accounts = (d.acctGroom.length||d.acctBride.length) ? `
    <div class="sec">
      <div class="eyebrow">With Heart</div>
      <div class="stitle">마음 전하실 곳</div>
      <div class="acc">${acctSide("신랑측 계좌번호",d.acctGroom)}${acctSide("신부측 계좌번호",d.acctBride)}</div>
    </div>` : "";

  // falling effect + background music
  const fx = (d.effect&&d.effect!=="none") ? `<div class="fxwrap"><canvas class="fx" data-effect="${d.effect}"></canvas></div>` : "";
  const music = d.music ? `<audio id="bgm" src="${d.music}" loop preload="auto"></audio>` : "";
  const musicBtn = d.music ? `<div class="musicwrap"><button class="musicbtn" data-music aria-label="배경음악 재생">♪</button></div>` : "";

  // live countdown to the ceremony
  const target = dt && d.time ? new Date(d.date+"T"+d.time) : (dt ? new Date(d.date+"T00:00") : null);
  const isFuture = target && target.getTime() > Date.now();
  const countdown = (d.countdown && isFuture) ? `
    <div class="countdown" data-countdown data-target="${target.getTime()}">
      <div class="cd-cell"><b class="d">–</b><span>일</span></div>
      <div class="cd-cell"><b class="h">–</b><span>시</span></div>
      <div class="cd-cell"><b class="m">–</b><span>분</span></div>
      <div class="cd-cell"><b class="s">–</b><span>초</span></div>
    </div>` : "";

  // guestbook (real & shared in exported file; static in preview)
  const slug = d.slug || "preview";
  const guestbook = d.guestbook ? `
    <div class="sec">
      <div class="eyebrow">Guestbook</div>
      <div class="stitle">축하 방명록</div>
      <div class="gb" data-gb data-slug="${esc(slug)}" data-url="${SUPA_URL}" data-key="${SUPA_KEY}">
        <div class="gb-form">
          <input class="gb-name" maxlength="20" placeholder="이름">
          <textarea class="gb-msg" maxlength="300" placeholder="축하 메시지를 남겨주세요"></textarea>
          <button class="gb-send">축하 남기기</button>

  return `
  ${fx}${music}`+`
  <div class="sec cover">
    ${cover}

      </div>

  <div class="sec">

    ${parents}

  <div class="sec">

function toKTime(t){ const [h,m]=t.split(":").map(Number); const ap=h<12?"오전":"오후"; const h12=h%12||12; return `${ap} ${h12}시${m?` ${m}분`:""}`; }

/* Interactions inside an invitation — self-contained so it also runs in the exported file */
function bindInvite(root){
  if(root._raf)cancelAnimationFrame(root._raf);
  if(root._cd)clearInterval(root._cd);
  if(root._fxResize){window.removeEventListener("resize",root._fxResize);root._fxResize=null;}

  // account accordions + copy
  root.querySelectorAll("[data-acc]").forEach(function(b){b.onclick=function(){b.closest(".acc-side").classList.toggle("open");};});
  root.querySelectorAll("[data-copy]").forEach(function(b){b.onclick=function(){
    if(navigator.clipboard)navigator.clipboard.writeText(b.dataset.copy);
    var t=b.textContent;b.textContent="복사됨";b.classList.add("done");
    setTimeout(function(){b.textContent=t;b.classList.remove("done");},1200);
  };});

  // background music
  var mbtn=root.querySelector("[data-music]"),audio=root.querySelector("#bgm");
  if(mbtn&&audio){mbtn.onclick=function(){
    if(audio.paused){audio.play();mbtn.classList.add("playing");}
    else{audio.pause();mbtn.classList.remove("playing");}
  };}

  // live countdown
  var cd=root.querySelector("[data-countdown]");
  if(cd){var target=+cd.dataset.target;
    var tick=function(){var diff=Math.max(0,target-Date.now()),s=Math.floor(diff/1000);
      var pad=function(n){return String(n).padStart(2,"0");};
      cd.querySelector(".d").textContent=Math.floor(s/86400);
      cd.querySelector(".h").textContent=pad(Math.floor(s%86400/3600));
      cd.querySelector(".m").textContent=pad(Math.floor(s%3600/60));
      cd.querySelector(".s").textContent=pad(s%60);};
    tick();root._cd=setInterval(tick,1000);}

  // falling petals / snow / hearts
  var cv=root.querySelector(".fx"),reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(cv&&!reduce){
    var kind=cv.dataset.effect,ctx=cv.getContext("2d"),parts=[];
    var col=(getComputedStyle(root).getPropertyValue("--rose")||"#C0857E").trim();
    var size=function(){cv.width=cv.clientWidth;cv.height=cv.clientHeight;};
    root._fxResize=size;window.addEventListener("resize",size);size();
    var N=kind==="snow"?48:kind==="hearts"?24:32;
    for(var i=0;i<N;i++)parts.push({x:Math.random(),y:Math.random(),r:6+Math.random()*7,sp:.12+Math.random()*.4,ph:Math.random()*6.28});
    var shape=function(x,y,r){
      if(kind==="snow"){ctx.globalAlpha=.85;ctx.fillStyle="#B7C7D8";ctx.beginPath();ctx.arc(x,y,r*.32,0,6.283);ctx.fill();return;}
      ctx.globalAlpha=.72;ctx.fillStyle=col;
      if(kind==="hearts"){ctx.save();ctx.translate(x,y);ctx.scale(r*.07,r*.07);ctx.beginPath();
        ctx.moveTo(0,3);ctx.bezierCurveTo(-5,-3,-11,3,0,10);ctx.bezierCurveTo(11,3,5,-3,0,3);ctx.fill();ctx.restore();return;}
      ctx.save();ctx.translate(x,y);ctx.rotate(y*.03);ctx.beginPath();ctx.ellipse(0,0,r*.5,r*.9,0,0,6.283);ctx.fill();ctx.restore();
    };
    var draw=function(){ctx.globalAlpha=1;ctx.clearRect(0,0,cv.width,cv.height);var w=cv.width,h=cv.height;
      for(var i=0;i<parts.length;i++){var p=parts[i];p.y+=p.sp/100;p.ph+=.02;
        if(p.y>1.06){p.y=-.06;p.x=Math.random();}
        shape((p.x+Math.sin(p.ph)*.03)*w,p.y*h,p.r);}
      root._raf=requestAnimationFrame(draw);};
    draw();
  }

  // guestbook — live & shared via Supabase (skipped for the in-app 'preview' slug)
  var gb=root.querySelector("[data-gb]");
  if(gb){
    var url=gb.dataset.url,key=gb.dataset.key,slug=gb.dataset.slug;
    var list=gb.querySelector(".gb-list"),nm=gb.querySelector(".gb-name"),ms=gb.querySelector(".gb-msg"),send=gb.querySelector(".gb-send");
    var eh=function(s){return (s||"").replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});};
    if(slug==="preview"){
      list.innerHTML='<div class="gb-empty">실제 청첩장(HTML 저장/클라우드 링크)에서는<br>하객들의 축하 메시지가 여기에 실시간으로 쌓입니다.</div>';
    }else{
      var paint=function(rows){list.innerHTML=(rows&&rows.length)
        ?rows.map(function(r){return '<div class="gb-item"><div class="who">'+eh(r.name)+'</div><div class="msg">'+eh(r.message)+'</div></div>';}).join("")
        :'<div class="gb-empty">첫 축하 메시지를 남겨주세요 🤍</div>';};
      var loadGb=function(){fetch(url+"/rest/v1/guestbook?slug=eq."+encodeURIComponent(slug)+"&select=name,message&order=created_at.desc&limit=200",
        {headers:{apikey:key,Authorization:"Bearer "+key}}).then(function(r){return r.json();}).then(paint)
        .catch(function(){list.innerHTML='<div class="gb-empty">방명록을 불러오지 못했어요.</div>';});};
      send.onclick=function(){var n=nm.value.trim(),m=ms.value.trim();
        if(!n||!m){alert("이름과 축하 메시지를 모두 입력해주세요.");return;}
        send.disabled=true;send.textContent="남기는 중…";
        fetch(url+"/rest/v1/guestbook",{method:"POST",headers:{apikey:key,Authorization:"Bearer "+key,"Content-Type":"application/json",Prefer:"return=minimal"},
          body:JSON.stringify({slug:slug,name:n,message:m})})
          .then(function(r){if(!r.ok)throw 0;nm.value="";ms.value="";loadGb();})
          .catch(function(){alert("전송에 실패했어요. 잠시 후 다시 시도해주세요.");})
          .then(function(){send.disabled=false;send.textContent="축하 남기기";});};
      loadGb();
    }
  }
}

/* image helpers */
function readImg(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file);});}
document.getElementById("cover-file").addEventListener("change",async e=>{

});
document.getElementById("gallery-file").addEventListener("change",async e=>{

  syncInputs(); paint(); e.target.value="";
});
function renderThumb(id,arr,isCover){
  const box=document.getElementById(id); box.innerHTML="";
  arr.forEach((src,i)=>{
    const d=document.createElement("div");d.className="thumb";
    d.innerHTML=`<img src="${src}"><button title="삭제">×</button>`;
    d.querySelector("button").onclick=()=>{ if(isCover)data.cover=""; else data.gallery.splice(i,1); syncInputs(); paint(); };
    box.appendChild(d);
  });
}

/* accounts */
function renderAccts(){
  ["groom","bride"].forEach(side=>{
    const key=side==="groom"?"acctGroom":"acctBride";
    const box=document.getElementById("acct-"+side); box.innerHTML="";
    data[key].forEach((a,i)=>{
      const row=document.createElement("div");row.className="acct";
      row.innerHTML=`<input placeholder="은행" value="${escAttr(a.bank)}">
        <input placeholder="계좌번호" value="${escAttr(a.number)}">
        <input placeholder="예금주" value="${escAttr(a.name)}">
        <button class="x" title="삭제">×</button>`;
      const [b,n,nm]=row.querySelectorAll("input");
      b.oninput=()=>{a.bank=b.value;paint()}; n.oninput=()=>{a.number=n.value;paint()}; nm.oninput=()=>{a.name=nm.value;paint()};
      row.querySelector(".x").onclick=()=>{data[key].splice(i,1);renderAccts();paint()};
      box.appendChild(row);
    });
  });
}
function escAttr(s){return (s||"").replace(/"/g,"&quot;")}
document.querySelectorAll(".addacct").forEach(b=>b.onclick=()=>{
  const key=b.dataset.side==="groom"?"acctGroom":"acctBride";
  data[key].push({bank:"",number:"",name:""}); renderAccts(); paint();
});

/* ---------------- Toolbar actions ---------------- */
document.getElementById("btn-sample").onclick=()=>{ data=structuredClone(SAMPLE); syncInputs(); paint(); };
document.getElementById("btn-reset").onclick=()=>{ if(confirm("입력한 내용을 모두 지울까요?")){ data=structuredClone(BLANK); syncInputs(); paint(); } };

/* shareable link — text fields only (photos are too large for a URL) */
document.getElementById("btn-link").onclick=()=>{
  const light={...data,cover:data.cover?"__":"",gallery:data.gallery.map(()=>"__"),music:data.music?"__":""};
  const enc=btoa(unescape(encodeURIComponent(JSON.stringify(light))));
  const url=location.origin+location.pathname+"#d="+enc;
  navigator.clipboard?.writeText(url);
  const b=document.getElementById("btn-link"); const t=b.textContent; b.textContent="복사됨 ✓";
  setTimeout(()=>b.textContent=t,1400);
  if(data.cover||data.gallery.length) alert("링크가 복사됐어요.\n※ 링크에는 글자 정보만 담깁니다. 사진까지 담으려면 아래 '청첩장 HTML 저장'으로 파일을 받아 배포하세요.");
};

/* download standalone invitation (photos embedded) */
function ensureSlug(){ if(!data.slug){ data.slug = Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,6); save(); } return data.slug; }
function buildStandalone(){
  ensureSlug();
  const title=`${data.groom||"신랑"} ♥ ${data.bride||"신부"} 모바일 청첩장`;
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>${esc(title)}</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="${esc(title)}">
<style>html,body{margin:0}body{background:#EAE3D6}.wrap{max-width:440px;margin:0 auto;min-height:100vh;box-shadow:0 0 60px rgba(0,0,0,.08)}${INVITE_CSS}</style>
</head><body><div class="wrap"><div class="invite theme-${data.theme||"sage"}">${renderInvite(data,true)}</div></div>
<script>${bindInvite.toString()};bindInvite(document.querySelector('.invite'));<\/script>
</body></html>`;
}
document.getElementById("btn-download").onclick=()=>{
  const blob=new Blob([buildStandalone()],{type:"text/html"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`${(data.groom||"신랑")}_${(data.bride||"신부")}_청첩장.html`;
  document.body.appendChild(a); a.click(); a.remove();
};

/* ☁ Cloud save — store the invitation and get a hosted link (viewer.html?s=slug) */
document.getElementById("btn-cloud").onclick=async ()=>{
  const b=document.getElementById("btn-cloud"), orig=b.textContent;
  if(!data.groom||!data.bride){ alert("신랑·신부 이름을 먼저 입력해주세요."); return; }
  b.disabled=true; b.textContent="저장 중…";
  try{
    const slug=ensureSlug();
    const res=await fetch(SUPA_URL+"/rest/v1/invitations?on_conflict=slug",{
      method:"POST",
      headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({slug,html:buildStandalone()})
    });
    if(!res.ok) throw new Error(await res.text());
    const link=location.origin+location.pathname.replace(/[^/]*$/,"")+"viewer.html?s="+slug;
    if(navigator.clipboard) navigator.clipboard.writeText(link);
    prompt("청첩장이 클라우드에 저장됐어요. 이 링크를 하객에게 보내세요:", link);
  }catch(e){
    alert("클라우드 저장에 실패했어요.\n(로컬 파일에서 열었다면 인터넷 연결을, 아티팩트 미리보기라면 배포본에서 시도하세요)\n\n"+(e.message||e));
  }finally{ b.disabled=false; b.textContent=orig; }
};

/* ---------------- Persistence ---------------- */
function save(){ try{ const light={...data,cover:data.cover,gallery:data.gallery};
  localStorage.setItem("mocheong", JSON.stringify(light)); }catch(e){/* quota: photos too big */} }
function load(){
  if(location.hash.startsWith("#d=")){
    try{ return JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(3))))); }catch(e){}
  }
  try{ const s=localStorage.getItem("mocheong"); if(s) return {...BLANK,...JSON.parse(s)}; }catch(e){}
  return null;
}

/* ---------------- Init ---------------- */
syncInputs(); paint();
</script>
